<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Source for public/og-card.png (the link preview card).

  To regenerate: copy this file into the built static export root so the
  absolute /img and /fonts paths resolve, open it at exactly 1200x630, and
  screenshot the .card element. Kept in scripts/ rather than public/ so it is
  not served as a page on the live site.
-->
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/fonts/tabler-icons.css">
<style>
  html,body { margin:0; padding:0; background:#073D30; }
  .card {
    width:1200px; height:630px; position:relative; overflow:hidden;
    font-family:Inter, system-ui, sans-serif; color:#fff;
  }
  /* Widened and anchored left so the event banner at the far right edge of the
     source frame ("Hiring Our Heroes") falls outside the card. VetPath is not
     affiliated with that program, and a link preview is the most decontextualised
     image the site has, so third-party signage must not appear in it. Matches the
     content rule already applied to the homepage video (see public/video/CREDITS.md). */
  .photo { position:absolute; top:0; left:0; width:118%; height:100%; object-fit:cover; object-position:left center; }
  /* Deep-green scrim, heavier on the left so the type always has a dark bed to sit on */
  .scrim { position:absolute; inset:0;
    background:linear-gradient(100deg, rgba(7,61,48,.96) 0%, rgba(7,61,48,.90) 42%, rgba(7,61,48,.58) 100%); }
  .inner { position:absolute; inset:0; padding:72px 80px; display:flex; flex-direction:column; justify-content:space-between; }
  .lockup { display:flex; align-items:center; gap:16px; }
  .mark { width:60px; height:60px; border-radius:15px;
    background:linear-gradient(145deg,#D98A3D,#BE762C); color:#073D30;
    display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:700; }
  .word { font-family:Fraunces, Georgia, serif; font-size:40px; font-weight:500; letter-spacing:-.01em; }
  h1 { font-family:Fraunces, Georgia, serif; font-weight:500; font-size:66px; line-height:1.08;
    letter-spacing:-.02em; margin:0 0 18px; max-width:19ch; }
  h1 .hl { color:#F0C285; }
  p { margin:0; font-size:26px; line-height:1.45; color:#D6E4DC; max-width:34ch; }
  .foot { display:flex; align-items:center; gap:14px; font-size:20px; color:#9FC2B4; }
  .dot { width:7px; height:7px; border-radius:50%; background:#D98A3D; }
</style>
</head>
<body>
  <div class="card">
    <img class="photo" src="/img/transition-summit-mentors.jpg" alt="">
    <div class="scrim"></div>
    <div class="inner">
      <div class="lockup">
        <span class="mark"><i class="ti ti-route"></i></span>
        <span class="word">VetPath</span>
      </div>
      <div>
        <h1>Leave with <span class="hl">your</span> gameplan.</h1>
        <p>Benefits, career paths, and the next 90 days, built around your service and your goals.</p>
      </div>
      <div class="foot">
        <span class="dot"></span>
        <span>Free for veterans &nbsp;·&nbsp; Every number has an official source</span>
      </div>
    </div>
  </div>
</body>
</html>
